<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>קביעת פגישה עם אביאל | ליווי אישי 1:1</title>
<meta name="description" content="קובעים פגישה עם אביאל — בוחרים יום ושעה, מקבלים אישור וזימון ליומן.">
<meta name="theme-color" content="#07090f">
<meta property="og:title" content="קביעת פגישה עם אביאל — ליווי אישי 1:1">
<meta property="og:description" content="בוחרים יום ושעה שנוחים לך, אביאל מאשר — והזימון אצלך ביומן.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aviel112.github.io/booking/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;
  --surf:rgba(255,255,255,.035);
  --surf2:rgba(255,255,255,.06);
  --brd:rgba(255,255,255,.08);
  --brd2:rgba(255,255,255,.14);
  --txt:#f2f4ff;
  --mut:#8b93b8;
  --grn:#00d68f;
  --grn2:#00ffc2;
  --red:#ff6b6b;
  --org:#ffb454;
  --blu:#5ea2ff;
  --r:18px;
  --grad:linear-gradient(135deg,#00d68f 0%,#00e5c0 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif;
  min-height:100vh;padding-bottom:70px;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(560px 420px at 85% -8%, rgba(0,214,143,.13), transparent 65%),
    radial-gradient(480px 380px at -10% 26%, rgba(94,162,255,.08), transparent 65%);
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit}
a{color:var(--grn)}

/* ---------- header / hero ---------- */
.hero{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:34px 20px 6px;text-align:center}
.hero .badge{
  display:inline-flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--brd2);
  border-radius:30px;padding:7px 16px;font-size:.78rem;font-weight:700;color:var(--grn);
  letter-spacing:.02em;margin-bottom:16px;
}
.hero .badge i{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:900;line-height:1.2;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{color:var(--mut);font-size:.95rem;margin-top:10px;line-height:1.7}
.hero .chips{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .chips span{background:var(--surf);border:1px solid var(--brd);border-radius:30px;padding:6px 14px;font-size:.74rem;color:var(--mut);font-weight:500}
.admin-link{position:absolute;top:18px;left:18px;background:var(--surf);border:1px solid var(--brd);color:var(--mut);border-radius:12px;width:40px;height:40px;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.admin-link:hover{color:var(--txt);border-color:var(--brd2)}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px 16px 0}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:18px 0 20px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;width:86px}
.stp .dot{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:1px solid var(--brd2);color:var(--mut);font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;transition:.25s}
.stp.on .dot{background:var(--grad);color:#053024;border-color:transparent;box-shadow:0 0 18px rgba(0,214,143,.35)}
.stp.done .dot{background:rgba(0,214,143,.15);color:var(--grn);border-color:rgba(0,214,143,.4)}
.stp small{font-size:.68rem;color:var(--mut);font-weight:600}
.stp.on small{color:var(--txt)}
.stp-line{flex:0 0 26px;height:2px;background:var(--brd);margin-bottom:18px;border-radius:1px}
.stp-line.done{background:rgba(0,214,143,.5)}

/* ---------- cards / views ---------- */
.view{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{
  background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);
  padding:22px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.card .hint{font-size:.8rem;color:var(--mut);margin-bottom:16px;line-height:1.6}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head b{font-size:1rem;font-weight:800}
.cal-nav{background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:10px;width:36px;height:36px;font-size:1.05rem;transition:.2s}
.cal-nav:hover:not(:disabled){border-color:var(--grn)}
.cal-nav:disabled{opacity:.25;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-grid .dow{text-align:center;font-size:.66rem;color:var(--mut);font-weight:700;padding:4px 0}
.day{
  aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:transparent;
  color:var(--mut);font-size:.88rem;font-weight:600;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative;transition:.18s;
}
.day.avail{background:var(--surf2);border-color:var(--brd);color:var(--txt)}
.day.avail .n-slots{font-size:.56rem;color:var(--grn);font-weight:700}
.day.avail:hover{border-color:var(--grn);transform:translateY(-1px)}
.day.sel{background:var(--grad);color:#053024;border-color:transparent;box-shadow:0 4px 18px rgba(0,214,143,.35)}
.day.sel .n-slots{color:#053024}
.day.off{opacity:.28;cursor:default}
.day.today::before{content:'';position:absolute;top:4px;width:4px;height:4px;border-radius:50%;background:var(--blu)}
.legend{display:flex;gap:16px;margin-top:14px;font-size:.7rem;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-left:5px}

/* ---------- slots ---------- */
.slot-date{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--grn);font-weight:800;margin-bottom:16px}
.slot-group{margin-bottom:16px}
.slot-group .sg-title{font-size:.74rem;color:var(--mut);font-weight:700;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{
  background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:12px;
  padding:13px 6px;font-size:.95rem;font-weight:700;transition:.18s;font-variant-numeric:tabular-nums;
}
.slot:hover{border-color:var(--grn);transform:translateY(-1px)}
.slot.sel{background:var(--grad);color:#053024;border-color:transparent}
.empty{color:var(--mut);font-size:.85rem;text-align:center;padding:24px 0;line-height:1.7}

/* ---------- form ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:.76rem;color:var(--mut);font-weight:700;margin-bottom:6px}
.field label .req{color:var(--grn)}
.field input,.field select,.field textarea{
  width:100%;background:var(--surf2);border:1px solid var(--brd);color:var(--txt);
  border-radius:12px;padding:12px 14px;font-size:.95rem;outline:none;transition:.2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--grn);box-shadow:0 0 0 3px rgba(0,214,143,.12)}
.field textarea{resize:vertical;min-height:66px}
.field .note{font-size:.68rem;color:var(--mut);margin-top:5px}
.summary{
  background:rgba(0,214,143,.07);border:1px solid rgba(0,214,143,.25);border-radius:14px;
  padding:14px 16px;font-size:.9rem;margin-bottom:16px;display:flex;flex-direction:column;gap:6px;
}
.summary b{color:var(--grn)}

/* ---------- buttons ---------- */
.btn{width:100%;border:none;border-radius:13px;padding:15px;font-size:.98rem;font-weight:800;transition:.2s;letter-spacing:.01em}
.btn-grn{background:var(--grad);color:#053024;box-shadow:0 6px 22px rgba(0,214,143,.3)}
.btn-grn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 26px rgba(0,214,143,.4)}
.btn-grn:disabled{opacity:.55;cursor:default;transform:none}
.btn-ghost{background:var(--surf2);border:1px solid var(--brd);color:var(--txt)}
.btn-ghost:hover{border-color:var(--brd2)}
.btn-red{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);color:var(--red)}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{flex:1}
.back-link{background:none;border:none;color:var(--mut);font-size:.83rem;font-weight:600;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.back-link:hover{color:var(--txt)}

/* ---------- success / timeline ---------- */
.success{text-align:center;padding:8px 0}
.success .big{font-size:3.4rem;margin-bottom:12px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.success h2{color:var(--grn);font-size:1.25rem;margin-bottom:8px}
.success p{color:var(--mut);font-size:.88rem;margin-bottom:20px;line-height:1.7}
.timeline{text-align:right;background:var(--surf2);border:1px solid var(--brd);border-radius:14px;padding:18px;margin-bottom:18px}
.tl{display:flex;gap:12px;position:relative;padding-bottom:20px}
.tl:last-child{padding-bottom:0}
.tl::before{content:'';position:absolute;right:13px;top:28px;bottom:0;width:2px;background:var(--brd)}
.tl:last-child::before{display:none}
.tl .ic{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:var(--surf2);border:1px solid var(--brd2);z-index:1}
.tl.done .ic{background:rgba(0,214,143,.15);border-color:rgba(0,214,143,.5)}
.tl .tx b{display:block;font-size:.85rem;margin-bottom:2px}
.tl .tx span{font-size:.74rem;color:var(--mut);line-height:1.5;display:block}

/* ---------- bookings list ---------- */
.bk{
  background:var(--surf2);border:1px solid var(--brd);border-radius:14px;
  padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.bk .info{font-size:.88rem;line-height:1.55;min-width:0}
.bk .info b{color:var(--txt)}
.bk .info .mut{color:var(--mut);font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.bk .acts{display:flex;gap:7px;flex-shrink:0;align-items:center}
.chip-st{font-size:.66rem;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap}
.st-pending{background:rgba(255,180,84,.12);color:var(--org);border:1px solid rgba(255,180,84,.4)}
.st-approved{background:rgba(0,214,143,.12);color:var(--grn);border:1px solid rgba(0,214,143,.4)}
.st-rejected{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.4)}
.st-cancelled{background:var(--surf2);color:var(--mut);border:1px solid var(--brd)}
.mini{border:none;border-radius:9px;padding:8px 11px;font-size:.76rem;font-weight:700;transition:.18s}
.mini.wa{background:rgba(0,214,143,.1);border:1px solid rgba(0,214,143,.35);color:var(--grn)}
.mini.del{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:var(--red)}
.mini.ok{background:var(--grad);border:none;color:#053024}
.mini.ns{background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.4);color:var(--org)}
.cf-badge{font-size:.64rem;font-weight:800;border-radius:20px;padding:3px 8px;white-space:nowrap;display:inline-block;margin-top:3px}
.cf-yes{background:rgba(0,214,143,.14);color:var(--grn);border:1px solid rgba(0,214,143,.4)}
.cf-wait{background:rgba(136,146,176,.12);color:var(--mut);border:1px solid var(--brd)}
.today-badge{background:var(--grad);color:#053024;font-size:.62rem;font-weight:900;border-radius:20px;padding:2px 9px;margin-right:6px}
.date-group{font-size:.76rem;color:var(--mut);font-weight:800;margin:18px 0 9px;display:flex;align-items:center;gap:10px}
.date-group::after{content:'';flex:1;height:1px;background:var(--brd)}

/* ---------- pending approve cards (admin) ---------- */
.pend{background:var(--surf2);border:1px solid rgba(255,180,84,.3);border-radius:14px;padding:16px;margin-bottom:10px}
.pend .who{font-size:.95rem;font-weight:800;margin-bottom:3px}
.pend .when{color:var(--grn);font-weight:700;font-size:.85rem;margin-bottom:6px}
.pend .meta{color:var(--mut);font-size:.78rem;line-height:1.6;margin-bottom:12px}
.pend .btn-row{margin-top:0}
.pend .btn{padding:11px;font-size:.85rem}

/* ---------- stats ---------- */
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:900;color:var(--grn)}
.stat span{font-size:.66rem;color:var(--mut);font-weight:600}
.resched-banner{background:rgba(94,162,255,.1);border:1px solid rgba(94,162,255,.4);color:var(--blu);border-radius:14px;padding:12px 16px;font-size:.82rem;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.resched-banner button{background:none;border:none;color:var(--blu);font-weight:800;text-decoration:underline;font-size:.78rem}

/* ---------- admin tabs ---------- */
.tabs{display:flex;gap:7px;margin-bottom:16px}
.tab{flex:1;background:var(--surf);border:1px solid var(--brd);color:var(--mut);border-radius:12px;padding:11px 4px;font-size:.78rem;font-weight:700;position:relative;transition:.2s}
.tab.on{background:var(--grad);color:#053024;border-color:transparent}
.tab .bdg{position:absolute;top:-7px;left:-4px;background:var(--org);color:#3a2200;font-size:.62rem;font-weight:900;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- availability editor ---------- */
.day.open-av{background:rgba(0,214,143,.13);border-color:rgba(0,214,143,.45);color:var(--txt)}
.day.open-av .hrs{font-size:.5rem;color:var(--grn);font-weight:700}
.day.closed-av{background:var(--surf2);border-color:var(--brd);color:var(--mut)}
.av-tools{display:flex;gap:8px;margin-top:14px}
.av-tools .btn{padding:11px;font-size:.8rem}
.hour-edit{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.hour-edit select,.hour-edit input[type=time]{background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:10px;padding:9px 10px;font-size:.82rem}
.hour-edit .btn{width:auto;padding:9px 16px;font-size:.8rem}

/* ---------- week editor ---------- */
.wk{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--brd)}
.wk:last-child{border-bottom:none}
.wk .name{width:50px;font-size:.85rem;font-weight:700}
.wk input[type=time]{background:var(--surf2);border:1px solid var(--brd);color:var(--txt);border-radius:9px;padding:8px;font-size:.8rem;flex:1;min-width:0}
.wk .dash{color:var(--mut)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--surf2);border:1px solid var(--brd2);border-radius:12px;transition:.18s}
.switch i::before{content:'';position:absolute;height:17px;width:17px;right:3px;top:2.5px;background:var(--mut);border-radius:50%;transition:.18s}
.switch input:checked + i{background:var(--grn);border-color:var(--grn)}
.switch input:checked + i::before{transform:translateX(-18px);background:#053024}
.wk.off-row input[type=time]{opacity:.3;pointer-events:none}

/* ---------- misc ---------- */
.skeleton{border-radius:var(--r);background:var(--surf);border:1px solid var(--brd);height:120px;position:relative;overflow:hidden;margin-bottom:14px}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.err-banner{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);color:var(--red);border-radius:14px;padding:14px 16px;font-size:.82rem;margin-bottom:14px;line-height:1.6}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#161b29;border:1px solid var(--grn);color:var(--txt);border-radius:12px;
  padding:12px 22px;font-size:.85rem;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);
  z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot-link{display:block;text-align:center;color:var(--mut);font-size:.78rem;background:none;border:none;margin:8px auto 0;text-decoration:underline;font-weight:500}
.foot-link:hover{color:var(--txt)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(5,48,36,.3);border-top-color:#053024;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes rot{to{transform:rotate(360deg)}}
footer{position:relative;z-index:1;text-align:center;color:var(--mut);font-size:.7rem;padding:26px 16px 10px;opacity:.7}

/* ---------- next meeting banner ---------- */
.next-mtg{
  background:rgba(0,214,143,.07);border:1px solid rgba(0,214,143,.3);border-radius:16px;
  padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.next-mtg .label{font-size:.74rem;color:var(--grn);font-weight:800;margin-bottom:2px}
.next-mtg .when{font-size:.9rem;font-weight:800;color:var(--txt)}
.next-mtg .actions{display:flex;gap:7px;flex-shrink:0}
.next-mtg .actions button{background:rgba(0,214,143,.15);border:1px solid rgba(0,214,143,.4);color:var(--grn);border-radius:9px;padding:7px 11px;font-size:.75rem;font-weight:700}

/* ---------- share button ---------- */
.share-btn{
  display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,.12);
  border:1px solid rgba(37,211,102,.4);color:#25d366;border-radius:12px;
  padding:9px 16px;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s;
  text-decoration:none;
}
.share-btn:hover{background:rgba(37,211,102,.2)}
.share-wrap{display:flex;justify-content:center;gap:9px;margin-top:14px;flex-wrap:wrap}

/* ---------- done screen extras ---------- */
.done-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.done-actions .btn{padding:13px}
.cal-dl-btn{background:rgba(94,162,255,.1);border:1px solid rgba(94,162,255,.4);color:var(--blu);border-radius:13px;padding:13px;font-size:.9rem;font-weight:700;width:100%;transition:.2s}
.cal-dl-btn:hover{background:rgba(94,162,255,.2)}

/* ---------- stat highlight ---------- */
.stat.grn-hi{background:rgba(0,214,143,.08);border-color:rgba(0,214,143,.3)}
.stat.grn-hi b{color:var(--grn2)}
</style>
</head>
<body>

<div class="hero">
  <button class="admin-link" id="adminBtn" title="כניסת מנהל">⚙️</button>
  <div class="badge"><i></i> פותחים זמן לפגישה הבאה</div>
  <h1>קובעים פגישה <em>אחד-על-אחד</em><br>עם אביאל</h1>
  <div class="sub">בוחרים יום ושעה שנוחים לך, אני מאשר —<br>והזימון נוחת לך ביומן. פשוט ככה.</div>
  <div class="chips">
    <span>🤝 ליווי אישי וצמוד</span>
    <span>📅 זימון אוטומטי ליומן</span>
    <span>🎥 אפשרות לפגישת וידאו</span>
  </div>
</div>

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

function launchConfetti(){
  const cvs=document.createElement('canvas');
  cvs.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(cvs);
  const ctx=cvs.getContext('2d');
  cvs.width=innerWidth; cvs.height=innerHeight;
  const ps=Array.from({length:80},()=>({
    x:Math.random()*cvs.width, y:-20,
    r:Math.random()*5+2,
    c:['#00d68f','#00ffc2','#5ea2ff','#ffb454','#ff6b6b','#ffffff'][Math.floor(Math.random()*6)],
    vx:(Math.random()-.5)*5, vy:Math.random()*3+2,
    rot:Math.random()*360, vr:(Math.random()-.5)*14, shape:Math.random()>.5?'rect':'circle'
  }));
  let af;
  (function draw(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=false;
    ps.forEach(p=>{
      if(p.y<cvs.height+20){alive=true;p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;p.vy+=0.055;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c+'cc';
      if(p.shape==='circle'){ ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill(); }
      else ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
    });
    if(alive) af=requestAnimationFrame(draw); else cvs.remove();
  })();
  setTimeout(()=>{cancelAnimationFrame(af);cvs.remove();},5000);
}

function makeIcs(date, time, slotMin, name){
  const p = t => parseInt(t,10);
  const [y,mo,d] = date.split('-').map(Number);
  const [hh,mm] = time.split(':').map(Number);
  const end = mm + slotMin;
  const eh = hh + Math.floor(end/60), em = end%60;
  const fmt = (n,l=2) => String(n).padStart(l,'0');
  const dt = s => `${fmt(y,4)}${fmt(mo)}${fmt(d)}T${fmt(s[0])}${fmt(s[1])}00`;
  return `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${dt([hh,mm])}\nDTEND:${dt([eh,em])}\nSUMMARY:פגישה עם אביאל\nDESCRIPTION:פגישה אישית 1:1 עם אביאל\nEND:VEVENT\nEND:VCALENDAR`;
}
function downloadIcs(date, time, slotMin){
  const blob = new Blob([makeIcs(date,time,slotMin)],{type:'text/calendar'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='פגישה-עם-אביאל.ics'; a.click();
}

/* ---------- API ---------- */
async function apiGet(params){
  if(DEMO) return demoApi(params);
  const r = await fetch(API + '?' + new URLSearchParams(params));
  return r.json();
}
async function apiPost(payload){
  if(DEMO) return demoApi(payload);
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
  return r.json();
}

/* מצב דמו לפיתוח מקומי בלבד */
function demoApi(p){
  const slots = {};
  const t = new Date();
  for(let i=1;i<=21;i++){
    const d = new Date(t); d.setDate(d.getDate()+i);
    if(d.getDay()===6) continue;
    slots[fmtDate(d)] = d.getDay()===5 ? ['07:00','08:00','09:00','10:00','11:00'] : ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00'];
  }
  const a = p.action;
  if(a==='state') return Promise.resolve({ok:true, slots, slotMin:60, phone:'972500000000'});
  if(a==='book') return Promise.resolve({ok:true, id:'demo'+Date.now()});
  if(a==='status') return Promise.resolve({ok:true, bookings:{}});
  if(a==='admin'){
    if(p.op==='list') return Promise.resolve({ok:true, bookings:[
      {id:'d1',date:fmtDate(new Date(t.getTime()+2*864e5)),time:'08:00',name:'דני כהן',phone:'0521234567',email:'a@b.com',note:'כתף רגישה',status:'pending',createdAt:''},

    ], avail: Object.fromEntries(Object.keys(slots).map(d=>[d,{start:'07:00',end:'15:00'}])), settings:{slotMin:60,bufferMin:0,minNoticeH:3,phone:'',meetLink:'',weekTemplate:[{on:true,start:'07:00',end:'15:00'},{on:true,start:'07:00',end:'15:00'},{on:true,start:'07:00',end:'15:00'},{on:true,start:'07:00',end:'15:00'},{on:true,start:'07:00',end:'15:00'},{on:true,start:'07:00',end:'12:00'},{on:false,start:'07:00',end:'12:00'}]}});
    if(p.op==='listSummaries') return Promise.resolve({ok:true, summaries:[]});
    if(p.op==='saveSummary') return Promise.resolve({ok:true, sent:!!p.send});

  }
  return Promise.resolve({ok:true});
}

function stepper(n){
  const steps = [[1,'יום'],[2,'שעה'],[3,'פרטים']];
  return `<div class="stepper">${steps.map(([i,l],k)=>
    `${k>0?`<div class="stp-line ${n>i-1?'done':''}"></div>`:''}
     <div class="stp ${n===i?'on':n>i?'done':''}"><div class="dot">${n>i?'✓':i}</div><small>${l}</small></div>`
  ).join('')}</div>`;
}

        b.disabled=false;

        else toast('לא הצלחנו לשנות — דבר עם אביאל');

      reschedId=null; await refreshState(); view='done'; render();

async function confirmBooking(){
  const name=$('#fName').value.trim(), phone=$('#fPhone').value.trim(),
        email=$('#fEmail').value.trim(), note=$('#fNote').value.trim();
  if(!name) return toast('חסר שם מלא');
  if(!/^0?5\d\d{7}$|^\+?9725\d{8}$/.test(phone.replace(/[- ]/g,''))) return toast('מספר טלפון לא תקין');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('כתובת אימייל לא תקינה');

  const btn=$('#confirm'); btn.disabled=true; btn.innerHTML='שולח בקשה<span class="spin"></span>';
  try{
    const res = await apiPost({action:'book', date:selDate, time:selTime, name, phone, email, note});
    if(!res.ok){
      btn.disabled=false; btn.textContent='שליחת בקשה לאישור ←';
      if(res.error==='slot_taken'){ toast('אופס — השעה נתפסה הרגע. בחר שעה אחרת'); await refreshState(); view='slots'; render(); }
      else if(res.error==='too_many') toast('יש לך כבר 3 פגישות פתוחות — דבר עם אביאל ישירות');
      else toast('משהו השתבש — נסה שוב');
      return;
    }
    localStorage.setItem('aviel_client', JSON.stringify({name,phone,email}));
    const mine = JSON.parse(localStorage.getItem('aviel_my_bookings')||'[]');
    mine.push(res.id); localStorage.setItem('aviel_my_bookings', JSON.stringify(mine));
    lastBooking={id:res.id,date:selDate,time:selTime,name};
    view='done'; render();
  }catch(e){
    btn.disabled=false; btn.textContent='שליחת בקשה לאישור ←';
    toast('בעיית תקשורת — נסה שוב');
  }
}

const ST_LABEL = {pending:'ממתין לאישור', approved:'מאושר ✓', rejected:'לא אושר', cancelled:'בוטל'};

async function renderMine(){
  app.innerHTML = '<div class="view"><div class="skeleton"></div></div>';

    try{ const r=await apiPost({action:'status', ids}); map=r.bookings||{}; }catch(e){}
  }
  const list = ids.map(id=> map[id]?{id,...map[id]}:null).filter(Boolean)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const today = fmtDate(new Date());
  const rows = list.filter(b=>b.date>=today && b.status!=='cancelled' && b.status!=='rejected');
  const past = list.filter(b=>b.date<today || b.status==='cancelled' || b.status==='rejected');

  app.innerHTML = `

          return `
          <div class="bk">
            <div class="info"><b>${heDate(b.date)} · ${b.time}</b><div class="mut">${esc(b.name)}</div>${confChip}</div>
            <div class="acts">
              <span class="chip-st st-${b.status}">${ST_LABEL[b.status]||b.status}</span>
              ${canConfirm?`<button class="mini ok" data-cf="${b.id}">✅ אשר הגעה</button>`:''}
              <button class="mini wa" data-re="${b.id}">🔄 שינוי</button>
              <button class="mini del" data-id="${b.id}">ביטול</button>
            </div>
          </div>`;}).join('') : '<div class="empty">אין פגישות קרובות</div>'}

          </div>`).join('') : ''}
      </div>
    </div>
  `;

  app.querySelectorAll('[data-re]').forEach(b=> b.onclick=()=>{
    reschedId=b.dataset.re; view='cal'; render();
  });
  app.querySelectorAll('[data-cf]').forEach(b=> b.onclick=async()=>{
    b.disabled=true; b.innerHTML='שולח<span class="spin"></span>';
    const r = await apiPost({action:'confirmMine', id:b.dataset.cf});
    toast(r.ok?(r.msg||'אישרת הגעה ✓'):'לא הצלחנו — נסה שוב');
    render();
  });
  app.querySelectorAll('.mini.del').forEach(b=> b.onclick=async()=>{
    if(!confirm('לבטל את הפגישה ?')) return;
    const saved = JSON.parse(localStorage.getItem('aviel_client')||'{}');
    const r = await apiPost({action:'cancelMine', id:b.dataset.id, phone:saved.phone||''});
    toast(r.ok?'הפגישה בוטלה':'לא הצלחנו לבטל — דבר עם אביאל');

/* ---------- admin ---------- */
async function loadAdmin(){
  app.innerHTML = '<div class="view"><div class="skeleton"></div><div class="skeleton"></div></div>';
  let r;
  try{ r = await apiPost({action:'admin', op:'list', key:adminKey}); }
  catch(e){ toast('בעיית תקשורת — נסה שוב'); view='cal'; render(); return false; }
  if(!r.ok){
    if(r.error==='unauthorized'){ isAdmin=false; localStorage.removeItem('aviel_admin_key'); toast('קוד שגוי'); }
    else toast('שגיאה זמנית — נסה שוב');
    view='cal'; render(); return false;
  }
  adminData = r;
  return true;
}

async function adminOp(op, extra){
  const r = await apiPost(Object.assign({action:'admin', op, key:adminKey}, extra||{}));
  if(r.msg) toast(r.msg);
  else if(!r.ok) toast('שגיאה — נסה שוב');
  return r;
}

function renderDiary(el){
  const today = fmtDate(new Date());
  const all = adminData.bookings;
  const upcoming = all.filter(b=>b.status==='approved' && b.date>=today)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const toMark = all.filter(b=>b.status==='approved' && b.date<today)
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const doneN = all.filter(b=>b.status==='completed').length;
  const noshowN = all.filter(b=>b.status==='noshow').length;
  const confN = upcoming.filter(b=>b.confirmed==='yes').length;

  const byDate = {};
  upcoming.forEach(b=>{ (byDate[b.date]=byDate[b.date]||[]).push(b); });

  function waLink(b, txt){
    const wa = String(b.phone).replace(/\D/g,'').replace(/^0/,'972');
    return `https://wa.me/${wa}?text=${encodeURIComponent(txt)}`;
  }
  function row(b){
    const cf = b.confirmed==='yes'
      ? '<span class="cf-badge cf-yes">✅ אישר/ה הגעה</span>'
      : '<span class="cf-badge cf-wait">⏳ טרם אישר/ה</span>';
    const msg = `היי ${b.name}! מזכיר לך — פגישה ${heDate(b.date)} בשעה ${b.time} 🤝 נתראה !`;
    return `<div class="bk">
      <div class="info"><b>${b.time}</b> · ${esc(b.name)}<div class="mut">${esc(b.phone)}${b.note?' · '+esc(b.note):''}</div>${cf}</div>
      <div class="acts">
        <a href="${waLink(b,msg)}" target="_blank"><button class="mini wa">💬</button></a>
        <button class="mini del" data-id="${b.id}">✕</button>
      </div>
    </div>`;
  }
  function markRow(b){
    return `<div class="bk">
      <div class="info"><b>${b.time}</b> · ${esc(b.name)}<div class="mut">${heDate(b.date)}${b.note?' · '+esc(b.note):''}</div></div>
      <div class="acts">
        <button class="mini ok" data-done="${b.id}">✓ בוצע</button>
        <button class="mini ns" data-ns="${b.id}">לא הגיע</button>
      </div>
    </div>`;
  }
  const groups = Object.keys(byDate).sort().map(d=>{
    const isToday = d===today;
    return `<div class="date-group">${isToday?'<span class="today-badge">היום</span>':''}${heDate(d)} · ${byDate[d].length} פגישות</div>` + byDate[d].map(row).join('');
  }).join('');

  el.innerHTML = `
    <div class="stats">
      <div class="stat${upcoming.filter(b=>b.date===today).length?' grn-hi':''}"><b>${upcoming.filter(b=>b.date===today).length}</b><span>היום</span></div>
      <div class="stat"><b>${confN}/${upcoming.length}</b><span>אישרו הגעה</span></div>
      <div class="stat"><b>${doneN}</b><span>בוצעו</span></div>
      <div class="stat${noshowN?' ':''}"><b>${noshowN}</b><span>לא הגיעו</span></div>
    </div>
    ${toMark.length?`
    <div class="card" style="border-color:rgba(255,180,84,.35)">
      <h2>⏳ ממתינות לסימון (${toMark.length})</h2>
      <div class="hint">פגישות שעבר זמנן — סמן אם בוצעו או שהלקוח לא הגיע (משחרר נתוני נוכחות)</div>
      ${toMark.map(markRow).join('')}
    </div>`:''}
    <div class="card">
      <h2>פגישות קרובות (${upcoming.length})</h2>
      <div class="hint">💬 — תזכורת ידנית בווטסאפ · ✕ — ביטול (מוחק מהיומן ושולח הודעה) · ✅ — הלקוח אישר הגעה דרך התזכורת</div>
      ${groups || '<div class="empty">אין פגישות מאושרות קרובות</div>'}
    </div>
  `;
  el.querySelectorAll('.mini.del').forEach(b=> b.onclick=async()=>{
    if(!confirm('לבטל את האימון ? האירוע יימחק מהיומן והמוזמן יקבל הודעה')) return;
    await adminOp('cancel',{id:b.dataset.id}); await loadAdmin(); renderAdmin();
  });
  el.querySelectorAll('[data-done]').forEach(b=> b.onclick=async()=>{
    await adminOp('markDone',{id:b.dataset.done}); await loadAdmin(); renderAdmin();
  });
  el.querySelectorAll('[data-ns]').forEach(b=> b.onclick=async()=>{
    if(!confirm('לסמן שהלקוח לא הגיע ?')) return;
    await adminOp('markNoshow',{id:b.dataset.ns}); await loadAdmin(); renderAdmin();
  });
}

}

      <div class="cal-grid">
        ${DAY_NAMES.map(n=>`<span class="dow">${n.slice(0,1)}'</span>`).join('')}
        ${cells}
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.75rem;color:var(--mut)">
        <span style="color:var(--grn);font-weight:900;font-size:.95rem">${openCount}</span>
        <span>${openCount===0?'ימים פתוחים ב'+MONTHS[m]+' — החודש סגור לחלוטין':'ימים פתוחים ב'+MONTHS[m]}</span>
      </div>
      <div class="av-tools">
        <button class="btn btn-grn" id="applyTpl">⚡ פתח את כל ${MONTHS[m]}</button>
        <button class="btn btn-ghost" id="closeAll" style="font-size:.78rem;padding:11px 14px;flex:0 0 auto">🔒 סגור הכל</button>
      </div>
      ${avSel && adminData.avail[avSel] ? `
      <div id="dayPanel" style="margin-top:14px;background:rgba(0,214,143,.06);border:1px solid rgba(0,214,143,.3);border-radius:14px;padding:14px">
        <div style="font-weight:800;font-size:.9rem;margin-bottom:10px">🗓️ ${heDate(avSel)}</div>
        <div class="hour-edit" style="margin-top:0">
          <span style="font-size:.78rem;color:var(--mut);font-weight:700">פתוח בין</span>
          <input type="time" id="dpStart" value="${adminData.avail[avSel].start}">
          <span class="dash">–</span>
          <input type="time" id="dpEnd" value="${adminData.avail[avSel].end}">
          <button class="btn btn-grn" id="dpSave" style="width:auto;padding:9px 18px;font-size:.8rem">שמור שעות</button>
          <button class="btn btn-red" id="dpClose" style="width:auto;padding:9px 14px;font-size:.8rem">סגור יום זה</button>
        </div>
      </div>` : `<div class="hint" style="margin:12px 0 0">לוחצים על יום בלוח — יום סגור יפתח; יום פתוח יאפשר עריכת שעות</div>`}
    </div>
  `;
  $('#avPrev').onclick=()=>{ avMonth=new Date(y,m-1,1); avSel=null; renderAvail(el); };
  $('#avNext').onclick=()=>{ avMonth=new Date(y,m+1,1); avSel=null; renderAvail(el); };

  el.querySelectorAll('.day[data-d]').forEach(b=> b.onclick=async()=>{
    const ds=b.dataset.d;
    if(!adminData.avail[ds]){
      const dow=parseDate(ds).getDay();
      const w=tpl[dow].on?tpl[dow]:{start:'07:00',end:'15:00'};
      adminData.avail[ds]={start:w.start,end:w.end};
      adminOp('setAvail',{set:{[ds]:adminData.avail[ds]}});
      toast(`${heDate(ds)} נפתח ✓`);
    }
    avSel=ds;
    renderAvail(el);
  });
  const dp=$('#dayPanel');
  if(dp){
    $('#dpSave').onclick=async()=>{
      const w={start:$('#dpStart').value,end:$('#dpEnd').value};
      adminData.avail[avSel]=w;
      await adminOp('setAvail',{set:{[avSel]:w}});
      toast('השעות עודכנו ✓'); renderAvail(el);
    };
    $('#dpClose').onclick=async()=>{
      delete adminData.avail[avSel];
      const d=avSel; avSel=null;
      renderAvail(el);
      await adminOp('setAvail',{remove:[d]});
      toast('היום נסגר');
    };
  }
  $('#applyTpl').onclick=async()=>{
    const btn=$('#applyTpl'); btn.disabled=true; btn.innerHTML='פותח את החודש<span class="spin"></span>';
    const r=await adminOp('applyTemplate',{month:ym});
    if(r.ok){ adminData.avail=r.avail; toast(`${MONTHS[m]} נפתח לפי השעות הקבועות ✓`); }
    renderAvail(el);
  };
  $('#closeAll').onclick=async()=>{
    if(!openCount) return toast(`אין ימים פתוחים ב${MONTHS[m]}`);
    if(!confirm(`לסגור את כל ${openCount} הימים הפתוחים ב${MONTHS[m]} ?`)) return;
    const btn=$('#closeAll'); btn.disabled=true; btn.textContent='סוגר...';
    const r=await adminOp('setAvail',{remove:openDates});
    if(r.ok){ adminData.avail=r.avail; avSel=null; toast(`${MONTHS[m]} נסגר לחלוטין`); }
    renderAvail(el);
  };

}

function renderCfg(el){
  const s=adminData.settings;
  el.innerHTML = `
    <div class="card">
      <h2>השעות הקבועות שלך</h2>
      <div class="hint">התבנית שלפיה נפתח חודש שלם בלחיצה אחת (בטאב זמינות)</div>
      ${s.weekTemplate.map((w,i)=>`
        <div class="wk ${w.on?'':'off-row'}" data-i="${i}">
          <label class="switch"><input type="checkbox" ${w.on?'checked':''}><i></i></label>
          <span class="name">${DAY_NAMES[i]}</span>
          <input type="time" class="t-start" value="${w.start}">
          <span class="dash">–</span>
          <input type="time" class="t-end" value="${w.end}">
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>הגדרות כלליות</h2>
      <div class="field"><label>משך פגישה (דקות)</label>
        <select id="cSlot">${[15,20,30,40,45,50,60,75,90].map(v=>`<option value="${v}" ${s.slotMin===v?'selected':''}>${v} דקות</option>`).join('')}</select></div>
      <div class="field"><label>הפסקה בין פגישות (דקות)</label>
        <select id="cBuffer">${[0,5,10,15,20,30].map(v=>`<option value="${v}" ${(s.bufferMin||0)===v?'selected':''}>${v===0?'בלי הפסקה':v+' דקות'}</option>`).join('')}</select></div>
      <div class="field"><label>כמה שעות מראש חייבים לקבוע</label>
        <select id="cNotice">${[0,1,2,3,6,12,24].map(v=>`<option value="${v}" ${s.minNoticeH===v?'selected':''}>${v} שעות</option>`).join('')}</select></div>
      <div class="field"><label>עד כמה זמן קדימה אפשר לקבוע</label>
        <select id="cMaxDays">${[14,21,30,45,60,90,120].map(v=>`<option value="${v}" ${(s.maxDaysAhead||60)===v?'selected':''}>${v} ימים</option>`).join('')}</select>
        <div class="note">לקוחות לא יראו תאריכים רחוקים מזה</div></div>
      <div class="field"><label>הטלפון שלך (לכפתורי ווטסאפ) — פורמט 9725XXXXXXXX</label>
        <input id="cPhone" value="${esc(s.phone||'')}" placeholder="972501234567" inputmode="tel"></div>
      <div class="field"><label>קישור לפגישה (זום / גוגל מיט) — יצורף אוטומטית לזימון ולמייל האישור</label>
        <input id="cMeet" value="${esc(s.meetLink||'')}" placeholder="https://meet.google.com/..." dir="ltr">
        <div class="note">משאירים ריק אם הפגישות פרונטליות</div></div>
      <button class="btn btn-grn" id="saveCfg">שמירת הגדרות</button>
    </div>
    <div class="card">
      <h2>📱 SMS אוטומטי (Twilio)</h2>
      <div class="hint">הגדרה אחת — ומכאן הלקוח מקבל SMS בכל שלב: בקשה / אישור / דחייה / ביטול. גם אתה מקבל SMS על כל בקשה חדשה.<br>נרשמים בחינם ב-<b>twilio.com</b> (אין צורך בכרטיס אשראי לתקופת ניסיון)</div>
      <div class="field"><label>Account SID</label>
        <input id="cTwSid" value="${esc(s.twilioSid||'')}" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" dir="ltr" autocomplete="off"></div>
      <div class="field"><label>Auth Token</label>
        <input id="cTwToken" type="password" value="${esc(s.twilioToken||'')}" placeholder="••••••••••••••••" dir="ltr" autocomplete="new-password"></div>
      <div class="field"><label>מספר השולח (מספר Twilio שלך)</label>
        <input id="cTwFrom" value="${esc(s.twilioFrom||'')}" placeholder="+1xxxxxxxxxx" dir="ltr" inputmode="tel">
        <div class="note">הפורמט: +1XXXXXXXXXX · למצוא ב-Twilio Console → Phone Numbers</div></div>
    </div>
    <div class="card">
      <h2>⏰ תזכורות אוטומטיות</h2>
      <div class="hint">המערכת שולחת תזכורת מאליה לפני כל פגישה — בלי שתצטרך לעשות כלום. דורש שה-SMS/מייל מוגדרים.</div>
      <div class="wk ${s.remind1On!==false?'':'off-row'}" id="rem1Row">
        <label class="switch"><input type="checkbox" id="cR1On" ${s.remind1On!==false?'checked':''}><i></i></label>
        <span class="name" style="flex:1">תזכורת מקדימה</span>
        <select id="cR1H" style="width:auto">${[48,36,24,12,6].map(v=>`<option value="${v}" ${(s.remind1H||24)===v?'selected':''}>${v} שעות לפני</option>`).join('')}</select>
      </div>
      <div class="note" style="margin:2px 0 12px">מייל + SMS עם כפתור "אשר/ת הגעה" וקישור לשינוי/ביטול</div>
      <div class="wk ${s.remind2On!==false?'':'off-row'}" id="rem2Row">
        <label class="switch"><input type="checkbox" id="cR2On" ${s.remind2On!==false?'checked':''}><i></i></label>
        <span class="name" style="flex:1">תזכורת אחרונה</span>
        <select id="cR2H" style="width:auto">${[4,3,2,1].map(v=>`<option value="${v}" ${(s.remind2H||3)===v?'selected':''}>${v} שעות לפני</option>`).join('')}</select>
      </div>
      <div class="note" style="margin:2px 0 12px">SMS קצר "עוד מעט נתראה" סמוך לפגישה</div>
      <div class="wk ${s.reqConfirm!==false?'':'off-row'}" id="reqcRow">
        <label class="switch"><input type="checkbox" id="cReqC" ${s.reqConfirm!==false?'checked':''}><i></i></label>
        <span class="name" style="flex:1">בקש אישור הגעה</span>
      </div>
      <div class="note" style="margin-top:2px">הלקוח מאשר בלחיצה — אתה רואה ביומן מי אישר ומקבל SMS</div>
    </div>
  `;
  ['rem1Row','rem2Row','reqcRow'].forEach(id=>{ const r=$('#'+id); if(r) r.querySelector('input[type=checkbox]').onchange=e=>r.classList.toggle('off-row',!e.target.checked); });
  el.querySelectorAll('.wk input[type=checkbox]').forEach(c=> c.onchange=e=>{
    e.target.closest('.wk').classList.toggle('off-row',!e.target.checked);
  });
  $('#saveCfg').onclick=async()=>{
    const week=[...el.querySelectorAll('.wk')].map(row=>({
      on: row.querySelector('input[type=checkbox]').checked,
      start: row.querySelector('.t-start').value,
      end: row.querySelector('.t-end').value
    }));
    const settings={slotMin:+$('#cSlot').value, bufferMin:+$('#cBuffer').value, minNoticeH:+$('#cNotice').value,
      maxDaysAhead:+$('#cMaxDays').value,
      phone:$('#cPhone').value.replace(/\D/g,''), meetLink:$('#cMeet').value.trim(),
      twilioSid:$('#cTwSid').value.trim(), twilioToken:$('#cTwToken').value.trim(), twilioFrom:$('#cTwFrom').value.trim(),
      remind1On:$('#cR1On').checked, remind1H:+$('#cR1H').value,
      remind2On:$('#cR2On').checked, remind2H:+$('#cR2H').value,
      reqConfirm:$('#cReqC').checked,
      weekTemplate:week};
    const btn=$('#saveCfg'); btn.disabled=true; btn.innerHTML='שומר<span class="spin"></span>';
    await adminOp('saveSettings',{settings});
    adminData.settings=settings;
    btn.disabled=false; btn.textContent='שמירת הגדרות';
    toast('ההגדרות נשמרו ✓');
  };
}

/* ---------- shared ---------- */
async function refreshState(){
  try{ const r=await apiGet({action:'state'}); if(r.ok) state=r; }catch(e){}
}

function render(){
  if(view==='cal') renderCal();
  else if(view==='slots') renderSlots();
  else if(view==='form') renderForm();
  else if(view==='done') renderDone();
  else if(view==='mine') renderMine();
  else if(view==='admin') renderAdmin();
}

$('#adminBtn').onclick = async ()=>{
  if(isAdmin){ view='admin'; render(); return; }
  const k = prompt('קוד מאמן :');
  if(k===null) return;
  adminKey = k.trim();
  if(await loadAdmin()){
    isAdmin=true; localStorage.setItem('aviel_admin_key', adminKey);
    view='admin'; render();
  }
};

(async function init(){
  app.innerHTML='<div class="skeleton"></div><div class="skeleton" style="height:300px"></div>';
  try{
    const r = await apiGet({action:'state'});
    if(!r.ok) throw new Error();
    state = r;
  }catch(e){
    app.innerHTML = `<div class="err-banner">לא הצלחנו להתחבר למערכת — בדקו את החיבור ונסו לרענן.</div>
      <button class="btn btn-ghost" onclick="location.reload()">רענון</button>`;
    return;
  }
  const now=new Date();
  const firstSlotMonth = Object.keys(state.slots).sort()[0];
  calMonth = firstSlotMonth ? new Date(+firstSlotMonth.slice(0,4), +firstSlotMonth.slice(5,7)-1, 1)
                            : new Date(now.getFullYear(), now.getMonth(), 1);
  // כניסת מאמן ישירה: ?admin=1
  if(new URLSearchParams(location.search).get('admin') && adminKey){
    if(await loadAdmin()){ isAdmin=true; view='admin'; }
  }
  render();
  // טעינת הפגישה הבאה ברקע
  const savedIds = JSON.parse(localStorage.getItem('aviel_my_bookings')||'[]');
  if(savedIds.length){
    apiPost({action:'status', ids:savedIds}).then(r=>{
      const today2 = fmtDate(new Date());
      const next = (Object.values(r.bookings||{}))
        .filter(b=>b.status==='approved' && b.date>=today2)
        .sort((a,b)=>a.date+a.time<b.date+b.time?-1:1)[0];
      if(next){ state._nextMeeting=next; if(view==='cal') render(); }
    }).catch(()=>{});
  }
})();
</script>
